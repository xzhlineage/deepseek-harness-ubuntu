name: Package Desktop · Linux

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '打包源码：仓库内分支或 tag'
        type: string
        default: master
        required: true

permissions:
  contents: read

concurrency:
  group: linux-desktop-package
  cancel-in-progress: false

jobs:
  package:
    name: Linux x64 deb
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref }}

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unsigned local target: no signing, update feed, or upload credentials are read.
      - name: Build unsigned deb
        run: pnpm run package:desktop:linux:x64

      - name: Record checksum
        run: |
          sha256sum apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb \
            | tee "${{ runner.temp }}/sha256.txt"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-deb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            ${{ runner.temp }}/sha256.txt
          if-no-files-found: error
          retention-days: 14
